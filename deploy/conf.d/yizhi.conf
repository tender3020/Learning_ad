# 弈智 — 反向代理到 Node（PORT=3000）
# 安装：sudo cp deploy/conf.d/yizhi.conf /etc/nginx/conf.d/yizhi.conf
# 校验：sudo nginx -t && sudo systemctl reload nginx

upstream yizhi_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  www.longxuexi.xyz longxuexi.xyz;

    # 有证书后取消注释，强制 HTTPS：
    # return 301 https://$host$request_uri;

    client_max_body_size 50m;

    # === 安全头 ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # === 哈希静态资源：强缓存（Vite 产出带 hash 的 assets）===
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass         http://yizhi_node;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # === AI / QA SSE：关闭缓冲，延长读超时 ===
    location ~ ^/api/ai/(stream|qa/stream)$ {
        proxy_pass         http://yizhi_node;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 75s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # === 其余全部反代到 Node（SPA + tRPC + TTS + uploads）===
    location / {
        proxy_pass         http://yizhi_node;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SPA / API 通用：SSE 兜底也关缓冲
        proxy_buffering    off;
        proxy_cache        off;

        proxy_connect_timeout 75s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}

